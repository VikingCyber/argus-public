# Шаблон конфигурации Argus. Скопируй в config.yaml и заполни под своё окружение:
#   vision\config.yaml  — локальная разработка (в git не попадает)
#   vision\config.prod.yaml — боевой сервер (в git не попадает)
backend:
  url: "http://localhost:8080"
  api_key: "CHANGE_ME"

cameras:
  - id: "cam-01"
    name: "Ворота"
    rtsp_url: rtsp://USER:PASSWORD@CAMERA_IP:554/Streaming/Channels/101
    # Кадры берём из релея stream_server (он держит ЕДИНСТВЕННОЕ RTSP-подключение).
    # ВАЖНО: stream_server должен быть запущен первым!
    relay_url: "http://localhost:8090/frame"
    tasks:
      # MVD-режим: трекинг кузовов + VEHICLE_SEEN с фото, без распознавания номеров.
      anpr: false
      unread_plate: false
      vehicle_seen: true
      night_person: false
      yellow_vest: false

night_window:
  start_hour: 20
  end_hour: 8

# Скорость опроса релея /frame для main.py и data_collector (кадр/с).
relay_fps: 30

# Качество JPEG. Камера отдаёт кадр в нативном разрешении, потери дают только
# перекодирования: /frame -> main.py -> снимок в письмо/журнал.
# snapshot_jpeg_quality — снимок события (95: было 85, повторное сжатие мылило
#   номер и номерной знак; файл примерно вдвое больше).
# view_jpeg_quality — живая картинка на странице :8090 и боксы на /stream
#   (80: на экране заметно чётче прежних 70, поток по LAN не растёт в разы).
snapshot_jpeg_quality: 95
view_jpeg_quality: 80

# ANPR-детектор номеров: imgsz 1280 находит на порядок больше номеров на
# обзорной камере (замер по датасету: 7% -> 80% кадров с детекцией).
# Апскейл мелкого кропа номера перед CRNN OCR.
anpr:
  imgsz: 1280
  upscale_min_height: 48
  upscale_max_factor: 5

thresholds:
  plate_min_conf: 0.5
  plate_min_votes: 5
  # Минимальная высота bbox номера в px: мельче — мусорное чтение (не голос).
  # Порог 10: у ворот номера 12-22 px, дальше за забором 8-14 px.
  plate_min_bbox_height: 10
  person_min_conf: 0.5
  # Порог уверенности детектора объектов: ниже 0.65 идёт уличный мусор
  # (растения, животные, мелкий шум) — такие боксы не показываем.
  object_min_conf: 0.65
  vest_yellow_min_ratio: 0.2

# Классы COCO, которые детектор объектов вообще ищет:
# 0=человек, 1=велосипед, 2=автомобиль, 3=мотоцикл, 5=автобус, 7=грузовик.
# Всё остальное (растения, куры, мебель) отсекается моделью на входе.
object_classes: [0, 1, 2, 3, 5, 7]

# Объектная модель: точнее (yolov8s) или быстрее (yolov8n).
object_model: "yolov8s.pt"
object_imgsz: 1280
object_detect_every_n_frames: 3
# Live-обзор: ANPR раз в N кадров (не конкурировать с main.py за CPU)
plate_detect_every_n_frames: 4

# Собственный NN-обзор stream_server (/stream с аннотациями) выключен по умолчанию:
# в MVD-режиме распознавание делает main.py, а stream_server должен быть лёгким
# релеем дешёвых кадров. Включение (live_nn: true) гоняет на CPU yolov8s@1280 +
# PlateReader@1280 и роняет весь пайплайн молотилкой в 0.1 fps. Для дебага можно
# запустить вручную: python stream_server.py --no-nn  (или live_nn: true).
live_nn: false

# Скорость сырого потока в обзоре (/raw). Потолок — физический FPS камеры.
raw_fps: 30

# Фоновый сбор кадров с ТС (для A/B теста моделей и будущего дообучения)
collect:
  dataset_dir: "dataset"
  check_interval_sec: 0.5   # как часто проверять наличие ТС
  min_interval_sec: 15      # минимум между сохранёнными кадрами
  diff_threshold: 9.0       # средняя попиксельная разница (0..255): сцена изменилась
  trigger_model: "yolov8n.pt"
  trigger_min_conf: 0.35
  trigger_imgsz: 640
  # Та же игнор-полоса, что в unread_plate
  ignore_rois:
    - [0.7617, 0.0736, 0.993, 0.4194]
  burst_max_frames: 6          # кадров на один проезд (серия, пока ТС едет мимо)
  burst_diff_threshold: 4.0    # чувствительность внутри серии ниже
  burst_interval_sec: 2.0      # шаг между кадрами серии
  notify_enabled: false        # письма VEHICLE_SEEN отключены (спам); кадры пишутся в dataset
  notify_cooldown_sec: 3600

cooldowns_sec:
  plate: 30
  night_person: 60
  yellow_vest: 30
  unread_plate: 300

# Тревога «ТС в кадре, но стабильный номер не распознан»
unread_plate:
  timeout_sec: 10
  model: "yolov8n.pt"
  # Порог уверенности для детекции ТС. Ниже него объект не считается машиной:
  # нет ни эпизода, ни бокса, ни записи в журнале.
  # Замер на весовой: стенд и здание за грузовиком определяются как truck
  # с уверенностью 0.55-0.59, реальные проезды идут 0.60 и выше.
  # 0.62 отсекает ложь с запасом и не срезает верх диапазона реальных.
  min_conf: 0.62
  imgsz: 640
  every_n_frames: 1
  # Порог голосов для отправки номера по эпизоду (одна машина = одно событие).
  plate_min_votes: 5
  # Сколько секунд трек может пропасть, прежде чем эпизод закроется. Должно быть
  # >= времени, за которое ByteTrack держит ID в буфере, иначе эпизод закроется
  # раньше, чем трекер вернёт тот же track_id, и проезд разорвётся на два события.
  track_exit_grace_sec: 45
  # Переприсвоение трека. У ворот и на развороте ByteTrack часто рвёт ID: штанга
  # перекрывает кузов, соседние ТС сливаются. Тогда появляется новый track_id, и без
  # переприсвоения одна машина даёт два эпизода — второе событие и второе письмо.
  # Новый track_id рядом с недавно пропавшим эпизодом наследует его состояние.
  # Сколько секунд эпизод ещё готов уступить ID другому треку.
  # 30 — под весовую: при низком FPS/пороге 0.62 детектор теряет машину на 10-30 с,
  # и окно 10 с оставляло дубли (до 3 писем на проезд). Выше ~40 с НЕ поднимать:
  # на этом объекте машины идут раз в ~60 с, долгое окно склеит СЛЕДУЮЩУЮ машину
  # с предыдущей, и она не уйдёт в письмо вовсе.
  track_reassoc_sec: 30
  # Насколько близко должны совпасть центры боксов (в долях диагонали бокса ТС).
  # Меньше — строже: реже склеиваются две разные машины в очередь.
  track_reassoc_dist_frac: 0.6
  # Сколько секунд ТС держится ЦЕЛИКОМ в кадре, прежде чем отправим
  # VEHICLE_SEEN не дожидаясь уезда (фура может стоять сутками).
  vehicle_seen_ready_sec: 3
  # Дедуп VEHICLE_SEEN по сцене. ByteTrack может потерять стоящую машину
  # (край кадра, низкий FPS), эпизод закроется — и при следующей детекции
  # родится новый эпизод с новым письмом по той же машине. После отправки
  # система запоминает машину и место; повторное событие по ней подавляется.
  # Запись обновляется на каждой детекции рядом, то есть следует за машиной,
  # пока её видно. 600 с — стоящая машина не даёт повторов, а уехавшая
  # «забывается» через 10 минут.
  vehicle_seen_dedup_sec: 600
  # Совпадение места: IoU боксов ИЛИ близость центров (доля диагонали бокса).
  vehicle_seen_dedup_iou: 0.3
  vehicle_seen_dedup_dist_frac: 0.8
  # Сцеп (тягач + прицеп): YOLO видит прицеп обычным грузовиком, эпизоды два —
  # перед отправкой проверяем, нет ли рядом только что отправленной машины.
  vehicle_seen_neighbor_sec: 20
  vehicle_seen_neighbor_dist_frac: 0.6
  # Память о машине, выехавшей за край кадра (следующая в этой точке — новое письмо).
  vehicle_seen_edge_ttl_sec: 30
  # Скорость отличает сцеп от чужой машины рядом (трактор мимо стоящей фуры).
  vehicle_seen_visible_sec: 2
  vehicle_seen_still_speed: 40
  vehicle_seen_speed_tolerance: 40
  # Насколько может отличаться позиция номера (в долях габаритов ТС) между
  # кадрами, чтобы считаться тем же физическим номером.
  plate_cluster_tolerance: 0.25
  # Доля площади кадра, с которой номер считаем «читаемым» (запуск таймера UNREAD).
  readable_min_area_frac: 0.02
  # roi: [0.0, 0.4, 1.0, 1.0]   # опциональная рабочая зона [x1,y1,x2,y2]
  # Игнор-полоса (roi_selector.py): деревья/дорога за забором в правом верхнем углу.
  # Всё остальное в кадре детектируется. Бокс игнорируется, когда >= 50% его
  # площади в зоне (раньше — по центру bbox: стоящий наполовину в зоне грузовик
  # детектировался и будил тревоги).
  ignore_rois:
    - [0.7617, 0.0736, 0.993, 0.4194]
  ignore_overlap_frac: 0.5
  # Чтения номеров отключены по всей ширине кадра выше нижней границы полосы:
  # дальняя дорога за забором продолжается левее полосы, и без этого проезжающие
  # транзитом машины дают мусорные события номеров.
  plate_ignore_rois:
    - [0.0, 0.0736, 1.0, 0.4194]
  # Зона въезда не используется (пусто = UNREAD для любых близких ТС вне игнор-полосы).
  entry_rois: []
  # Повторная UNREAD по той же позиции (IoU >= dedup_iou) подавляется это время.
  unread_scene_dedup_sec: 600
  unread_scene_dedup_iou: 0.3
  plate_repeat_cooldown_sec: 600
  # Допуск привязки номера к треку (доля от ширины/высоты bbox трека).
  plate_attach_margin_frac: 0.5

person_detect_every_n_frames: 3
