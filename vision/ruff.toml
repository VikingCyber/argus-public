# Конфигурация ruff для Argus vision.
#
# Автоправки (--fix) применены ко всем правилам из дефолтного набора, кроме
# DTZ005 — см. ниже. Цель: стабильный `ruff check .` = 0 ошибок.

[lint]
# DTZ005 "datetime.now() without tz" — осознанно игнорируем:
#  - detected_at уходит в backend как naive ISO (YYYY-MM-DDTHH:MM:SS),
#    который парсится через LocalDateTime.parse() — суффикс часового пояса
#    (+00:00/Z) бросал бы DateTimeParseException;
#  - имена файлов датасета и окно ночи тоже локальные.
# Проект живёт в локальном времени сервера (Один часовой пояс на хост).
extend-ignore = [
  "DTZ005",
]