name: Заявка от заказчика
description: Что-то работает не так или нужно доработать — заполните поля
title: "[Заявка] "
labels: ["источник: заказчик"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что пишете. Чем точнее время и место, тем быстрее мы найдём
        кадры и причину. Все поля со звёздочкой обязательны.

  - type: dropdown
    id: kind
    attributes:
      label: Что это
      options:
        - Ошибка — работает неправильно
        - Нужна доработка
        - Вопрос
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Своими словами — что вы ожидали и что случилось на самом деле.
      placeholder: >-
        Например: проехала машина с прицепом, пришло два письма с интервалом
        несколько секунд. Ожидали одно письмо.
    validations:
      required: true

  - type: input
    id: when
    attributes:
      label: Когда это было
      description: Дата и время. Если есть письмо — время из письма, если нет — по камере.
      placeholder: "11.11.2026, 11:45"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Насколько срочно
      options:
        - Мешает работе прямо сейчас
        - Мешает, но можно подождать
        - Не срочно
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Фото, номера писем, подробности
      description: >-
        Можно перетащить снимок сюда или вставить из буфера. Если это про
        письмо — приложите снимок из письма. Если повторяется — напишите, как часто.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        Дальше заявка сама попадёт на доску. Статусы: **Входящие** → **Бэклог** →
        **В работе** → **На проверке** → **Готово**. «На проверке» значит, что
        исправление уже выкачено и нужно ваше подтверждение.
