name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vision:
    name: Vision — типы и тесты
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vision
    steps:
      - name: Checkout (с submodule anpr)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # CPU-сборка torch: обычный pip тянет CUDA-пакеты (~2.5 ГБ), в CI они не нужны.
      # Версии держат в vision/requirements.txt — тут только индекс.
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pyright

      - name: Pyright
        run: pyright --pythonpath "$(which python)" .

      - name: Pytest
        run: pytest tests -q

      # Windows PowerShell 5.1 (стандарт на сервере) читает .ps1 без BOM как ANSI,
      # и русский текст превращается в «умные кавычки», которые рвут строки.
      - name: PowerShell — кодировка .ps1
        working-directory: .
        run: |
          python - <<'PY'
          import pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.ps1'):
              if any(x in p.parts for x in ('.venv', 'target', 'node_modules')):
                  continue
              b = p.read_bytes()
              if not b.startswith(b'\xef\xbb\xbf') and any(c > 127 for c in b):
                  bad.append(str(p))
          if bad:
              print('НЕТ BOM, 5.1 прочитает как ANSI:', bad)
              sys.exit(1)
          print('все .ps1 с BOM или чисто ASCII')
          PY

  backend:
    name: Backend — сборка
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Собрать jar
        run: mvn -B -DskipTests package

      # Артефакт нужен только для ручной выкатки (взять jar и задеплоить руками):
      # сам деплой идёт через git pull + сборку на сервере. Заливать на каждый
      # пуш нельзя — fat-jar ~70 МБ быстро упирается в квоту артефактов Github
      # (500 МБ на приватных репо), и CI падает на upload-artifact.
      - name: Артефакт (только теги и ручной запуск)
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: argus-backend
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7
